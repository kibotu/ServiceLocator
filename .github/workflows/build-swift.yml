name: Swift

on: [push]

jobs:
  build:
    name: Swift ${{ matrix.swift }} on ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: swift-actions/setup-swift@v2
        with:
          xcode-version: 'latest'

      - name: Log toolchain versions
        run: |
          echo "== macOS =="
          sw_vers
          echo "== Xcode =="
          xcodebuild -version
          xcode-select -p
          echo "== Swift =="
          swift --version

      - name: Build
        run: swift build
      - name: Run tests
        run: swift test
