name: Swift

on: [push]

jobs:
  build:
    name: macOS 27 / Xcode latest on ${{ matrix.os }}
    strategy:
      matrix:
        os: [xcode-27]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Log toolchain versions
        run: |
          echo "== macOS =="
          sw_vers
          echo "== Xcode =="
          xcodebuild -version
          xcode-select -p
          echo "== Swift =="
          swift --version
          echo "== iOS simulator runtimes =="
          xcrun simctl list runtimes | grep -E '^iOS'

      - name: Build (macOS)
        run: swift build

      - name: Test (macOS)
        run: swift test

      - name: Test on iPhone 18 Pro (iOS latest)
        run: |
          xcodebuild \
            -scheme ServiceLocator \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=latest' \
            test
